; Nightshift pressure-01 firmware.
; Platform/tool versions are pinned for reproducible builds.

[platformio]
default_envs = esp32-s3-devkitc-1

[env]
lib_deps =
    bblanchon/ArduinoJson@7.4.3

[env:esp32-s3-devkitc-1]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_port = COM9
monitor_port = COM9
upload_speed = 460800

; USB CDC for native USB port
; Board has OPI flash + OPI PSRAM (ESP32-S3 with Embedded PSRAM 16MB)
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
build_flags =
    -DCORE_DEBUG_LEVEL=3

[env:esp32-s3-tests]
extends = env:esp32-s3-devkitc-1
test_framework = unity
test_filter = test_core
test_build_src = yes
build_src_filter =
    +<debounce.cpp>
    +<payload.cpp>
    +<publish_scheduler.cpp>
    +<boot_identity.cpp>

; Host tests compile the same core sources used by the target firmware.
[env:native]
platform = native
test_framework = unity
test_filter = test_core
test_build_src = yes
build_src_filter =
    +<debounce.cpp>
    +<payload.cpp>
    +<publish_scheduler.cpp>
    +<boot_identity.cpp>
build_flags =
    -std=c++17
lib_deps =
    ${env.lib_deps}
    throwtheswitch/Unity@2.6.1
