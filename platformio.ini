; PlatformIO configuration for nightshift-esp32 pressure node
; Target: ESP32-S3-DevKitC-1, Device ID: pressure-01

[env:esp32-s3-devkitc-1]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino

; Serial / upload
monitor_speed = 115200
upload_port = COM9
monitor_port = COM9
upload_speed = 921600

; USB CDC for native USB port
; Board has OPI flash + OPI PSRAM (ESP32-S3 with Embedded PSRAM 16MB)
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

; Libraries
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8

; Test environment for native unit tests
[env:native]
platform = native
build_flags =
    -std=c++17
    -DUNITY_INCLUDE_DOUBLE
lib_deps =
    throwtheswitch/Unity@^2.5.2
test_framework = unity
